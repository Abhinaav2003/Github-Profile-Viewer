<!DOCTYPE html>
<html lang="en" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Look up any public GitHub profile and see its repositories, stars, forks, and languages.">
    <title>GitHub Stats Viewer</title>
    <link rel="icon" type="image/x-icon" th:href="@{/assets/favicon.ico(v=2)}" href="assets/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Applies the saved/system theme before first paint (no flash) -->
    <script>
        (function () {
            var root = document.documentElement;
            var media = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
            function stored() { try { return localStorage.getItem('theme'); } catch (e) { return null; } }
            function apply(t) {
                root.setAttribute('data-bs-theme', t);
                var b = document.getElementById('themeToggle');
                if (b) {
                    var l = t === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
                    b.setAttribute('aria-label', l);
                    b.setAttribute('title', l);
                }
            }
            apply(stored() || (media && media.matches ? 'dark' : 'light'));
            document.addEventListener('DOMContentLoaded', function () {
                apply(root.getAttribute('data-bs-theme'));
                var b = document.getElementById('themeToggle');
                if (!b) return;
                b.addEventListener('click', function () {
                    var next = root.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
                    try { localStorage.setItem('theme', next); } catch (e) {}
                    apply(next);
                });
            });
            if (media && media.addEventListener) {
                media.addEventListener('change', function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
            }
        })();
    </script>

    <style>
        :root, [data-bs-theme="light"] {
            color-scheme: light;
            --bg: #ffffff; --panel: #ffffff; --hover: #f4f4f5; --border: #e4e4e7;
            --text: #18181b; --muted: #71717a;
            --accent: #18181b; --accent-hover: #3f3f46; --accent-contrast: #ffffff;
            --ring: rgba(24, 24, 27, .12);
        }
        [data-bs-theme="dark"] {
            color-scheme: dark;
            --bg: #09090b; --panel: #111113; --hover: #1c1c1f; --border: #27272a;
            --text: #fafafa; --muted: #a1a1aa;
            --accent: #fafafa; --accent-hover: #d4d4d8; --accent-contrast: #09090b;
            --ring: rgba(250, 250, 250, .14);
        }

        * { box-sizing: border-box; }
        body {
            background: var(--bg); color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh; display: flex; flex-direction: column;
            transition: background-color .15s ease, color .15s ease;
        }
        .text-secondary { color: var(--muted) !important; }
        a:focus-visible, button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

        /* Nav */
        .nav-bar { padding: 20px 0; }
        .brand { color: var(--text); font-weight: 600; letter-spacing: -.2px; text-decoration: none; display: inline-flex; align-items: center; gap: 10px; }
        .brand-mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); }
        .theme-toggle {
            display: inline-grid; place-items: center; width: 36px; height: 36px; padding: 0;
            background: transparent; color: var(--muted); border: 0; border-radius: 8px; cursor: pointer;
            transition: color .15s ease, background-color .15s ease;
        }
        .theme-toggle:hover { color: var(--text); background: var(--hover); }
        .theme-toggle svg { width: 18px; height: 18px; }
        [data-bs-theme="dark"] .icon-moon, [data-bs-theme="light"] .icon-sun { display: none; }

        /* Hero */
        main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .hero { max-width: 640px; margin: 0 auto; padding: 72px 0 96px; text-align: center; }
        .hero-title { font-size: clamp(2.2rem, 6vw, 3.5rem); font-weight: 700; letter-spacing: -.04em; line-height: 1.08; margin-bottom: 16px; }
        .hero-copy { color: var(--muted); font-size: 1.1rem; line-height: 1.6; margin-bottom: 36px; }

        .search-form {
            display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 18px;
            background: var(--panel); border: 1px solid var(--border); border-radius: 999px;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        .search-form:focus-within { border-color: var(--muted); box-shadow: 0 0 0 4px var(--ring); }
        .search-input {
            flex: 1; min-width: 0; padding: 10px 4px; font-size: 1rem;
            background: transparent !important; color: var(--text) !important;
            border: 0 !important; box-shadow: none !important;
        }
        .search-input::placeholder { color: var(--muted); opacity: .8; }
        .search-button {
            flex-shrink: 0; padding: 10px 22px; border: 0; border-radius: 999px; cursor: pointer;
            background: var(--accent); color: var(--accent-contrast); font-weight: 600; font-size: .95rem;
            transition: background-color .15s ease;
        }
        .search-button:hover { background: var(--accent-hover); }

        .error-alert { border-radius: 12px; text-align: left; }
        .example { margin-top: 18px; font-size: .92rem; color: var(--muted); }
        .example a { color: var(--text); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--border); }
        .example a:hover { text-decoration-color: var(--text); }

        /* Features */
        .features { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 28px; margin-top: 56px; color: var(--muted); font-size: .92rem; }
        .features span::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); margin-right: 8px; vertical-align: middle; }

        .site-footer { padding: 24px 0 32px; border-top: 1px solid var(--border); color: var(--muted); font-size: .85rem; }

        @media (max-width: 576px) {
            .hero { padding: 40px 0 64px; }
            .search-form { flex-wrap: wrap; border-radius: 16px; padding: 6px; }
            .search-input { flex-basis: 100%; padding: 12px; }
            .search-button { width: 100%; border-radius: 10px; }
        }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
</head>
<body>
<nav class="nav-bar">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="brand" th:href="@{/}"><span class="brand-mark"></span>GitHub Stats</a>

        <button type="button" id="themeToggle" class="theme-toggle" aria-label="Switch theme" title="Switch theme">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
            </svg>
        </button>
    </div>
</nav>

<main class="container">
    <section class="hero">
        <h1 class="hero-title">Explore any GitHub profile</h1>
        <p class="hero-copy">See repositories, stars, forks, and languages in one clean view.</p>

        <form class="search-form" th:action="@{/profile}" method="get">
            <input class="form-control search-input" type="text" name="username"
                   placeholder="Enter a GitHub username"
                   th:value="${searchedUsername}" required maxlength="39" autocomplete="off"
                   aria-label="GitHub username">
            <button class="search-button" type="submit">View profile</button>
        </form>

        <div class="alert alert-danger error-alert mt-3" role="alert" th:if="${error}" th:text="${error}"></div>

        <div class="example">Try <a th:href="@{/profile(username='Abhinaav2003')}">Abhinaav2003</a></div>

        <div class="features">
            <span>Followers and bio</span>
            <span>Sort by stars or forks</span>
            <span>Language breakdown</span>
        </div>
    </section>
</main>

<footer class="site-footer">
    <div class="container d-flex flex-wrap justify-content-between gap-2">
        <span>Developed by Abhinav Tiwari</span>
        <span>Java 17 · Spring Boot · GitHub REST API</span>
    </div>
</footer>
</body>
</html>
